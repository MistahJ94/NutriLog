name: Build NutriLog Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8
        run: npm install --save-dev typescript @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets@3.0.5

      - name: Build NutriLog web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate NutriLog Android assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#090b0d' --iconBackgroundColorDark '#090b0d' --splashBackgroundColor '#090b0d' --splashBackgroundColorDark '#090b0d'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android app version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + BUILD_NUMBER))
          VERSION_NAME="${RELEASE_TAG}"
          if [[ "$VERSION_NAME" != v* ]]; then
            VERSION_NAME="1.0.${BUILD_NUMBER}"
          else
            VERSION_NAME="${VERSION_NAME#v}"
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -Fq "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${VERSION_NAME}\"" android/app/build.gradle
          echo "Verified Android version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/nutrilog-release.jks
          test -s android/app/nutrilog-release.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // NutriLog release signing (GitHub Actions)
          android {
              signingConfigs {
                  nutrilogRelease {
                      storeFile file('nutrilog-release.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.nutrilogRelease
                  }
              }
          }
          GRADLE

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify Android release APK signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Rename signed release files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nutrilog.apk
          cp android/app/build/outputs/bundle/release/app-release.aab nutrilog-release.aab

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nutrilog-android-release
          path: |
            nutrilog.apk
            nutrilog-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Android release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nutrilog.apk
            nutrilog-release.aab
          name: NutriLog ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
