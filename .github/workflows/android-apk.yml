name: Build NutriLog Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8
        run: npm install --no-save typescript @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets@3.0.5

      - name: Build NutriLog web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate NutriLog Android assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#090b0d' --iconBackgroundColorDark '#090b0d' --splashBackgroundColor '#090b0d' --splashBackgroundColorDark '#090b0d'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nutrilog.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: nutrilog-android-debug
          path: nutrilog.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nutrilog.apk
          name: NutriLog ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
