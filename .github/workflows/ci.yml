name: NutriLog CI

on:
  push:
    branches: [main, develop/nutrilog-platform]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check server/index.cjs
      - run: npm run build
